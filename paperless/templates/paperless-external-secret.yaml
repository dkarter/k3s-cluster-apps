# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-external-secret
  namespace: paperless
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: paperless-secret
    creationPolicy: Owner
  data:
    - secretKey: PAPERLESS_SECRET_KEY
      remoteRef:
        key: paperless
        property: PAPERLESS_SECRET_KEY
    - secretKey: PAPERLESS_ADMIN_USER
      remoteRef:
        key: paperless
        property: PAPERLESS_ADMIN_USER
    - secretKey: PAPERLESS_ADMIN_PASSWORD
      remoteRef:
        key: paperless
        property: PAPERLESS_ADMIN_PASSWORD
