# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  jobLabel: app
  selector:
    matchLabels:
      app: operator
  podMetricsEndpoints:
    - portNumber: 8080
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
