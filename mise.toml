[env]
OPENCODE_CONFIG = "{{config_root}}/opencode.v2.jsonc"

[tools]
dprint = "latest"
elixir = "1.19.5-otp-28"
erlang = "28"
helm = "latest"
jq = "latest"
lefthook = { version = "latest" }
"pipx:check-jsonschema" = "0.37.1"
task = "latest"
"github:crate-ci/committed" = "latest"
aube = "latest"
uv = "0.12.5"
fnox = "1.35.0"
age = "1.3.2"
yq = "4.53.6"
terraform = "1.16.1"

[tasks.terraform]
description = "Runs Terraform for Cloudflare with credentials supplied by fnox"
run = "fnox exec -- terraform -chdir=terraform/cloudflare"

[hooks]
postinstall = "lefthook install"

[settings]
experimental = true
disable_backends = ["asdf"]
npm.package_manager = "aube"
