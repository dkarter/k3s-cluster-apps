[env]
HK_HIDE_WHEN_DONE = "1"

[tools]
dprint = "latest"
elixir = "1.19.5-otp-28"
erlang = "28"
helm = "latest"
jq = "latest"
"pipx:check-jsonschema" = "0.37.1"
task = "latest"
"github:crate-ci/committed" = "latest"
aube = "latest"
uv = "0.12.5"
fnox = "1.35.0"
age = "1.3.2"
yq = "4.53.6"
terraform = "1.16.1"
hk = "2.1.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"
shfmt = "3.14.1"
bun = "1.4.2"

[tasks.terraform]
description = "Runs Terraform for Cloudflare with credentials supplied by fnox"
run = "fnox exec -- terraform -chdir=terraform/cloudflare"

[hooks]
postinstall = "hk install --mise"

[settings]
experimental = true
disable_backends = ["asdf"]
npm.package_manager = "aube"
