# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: csi-driver-smb
spec:
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kube-system

  sources:
    - chart: csi-driver-smb
      repoURL: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-smb/master/charts
      targetRevision: 1.20.3
      helm:
        releaseName: csi-driver-smb
        valuesObject:
          # Disable Windows support for Raspberry Pi cluster
          windows:
            enabled: false
          controller:
            extraArgs:
              csiProvisioner:
                - '--http-endpoint=:29645'
              csiResizer:
                - '--http-endpoint=:29646'

    - path: csi-driver-smb
      repoURL: 'https://github.com/dkarter/k3s-cluster-apps.git'
      targetRevision: HEAD

  project: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
