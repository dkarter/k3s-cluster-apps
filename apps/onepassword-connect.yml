# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onepassword-connect
spec:
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: onepassword-connect

  source:
    chart: connect
    repoURL: https://1password.github.io/connect-helm-charts
    targetRevision: 2.4.1
    helm:
      releaseName: connect
      valuesObject:
        connect:
          # The bootstrap repository creates this Secret before Connect starts.
          credentialsName: op-credentials
          # Roll the pods after the bootstrap Secret is corrected to raw JSON.
          # The subPath-mounted credentials file does not update in existing pods.
          podAnnotations:
            k3s.pro/credentials-file-format: json-v1
          # Replace only this Deployment: the legacy OP_SESSION valueFrom must
          # be removed when switching to the chart's mounted credentials path.
          # Do not use Force=true (delete/recreate) or application-wide Replace.
          annotations:
            argocd.argoproj.io/sync-options: Replace=true
          serviceType: NodePort
          api:
            serviceMonitor:
              enabled: true
              interval: 15s

  project: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
