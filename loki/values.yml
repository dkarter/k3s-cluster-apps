# yaml-language-server: $schema=https://raw.githubusercontent.com/grafana-community/helm-charts/loki-18.12.1/charts/loki/values.schema.json?rollout-operator.grafana.com
deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: '2024-04-01'
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: filesystem
  limits_config:
    allow_structured_metadata: true
    discover_log_levels: true
    volume_enabled: true
    retention_period: 168h
    max_query_lookback: 168h
    ingestion_rate_mb: 0.125
    ingestion_burst_size_mb: 2
    per_stream_rate_limit: 64KB
    per_stream_rate_limit_burst: 512KB
    max_line_size: 64KB
    reject_old_samples: true
    reject_old_samples_max_age: 168h
  compactor:
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_enabled: true
    retention_delete_delay: 2h
    delete_request_store: filesystem
  pattern_ingester:
    enabled: true
  querier:
    max_concurrent: 4

singleBinary:
  replicas: 1
  sidecar: false
  podDisruptionBudget:
    enabled: false
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    storageClass: longhorn-logging
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 1Gi

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
gateway:
  enabled: false

monitoring:
  dashboards:
    enabled: true
  rules:
    enabled: true
  alerts:
    enabled: true
  serviceMonitor:
    enabled: true
  additionalPrometheusRules:
    logging:
      groups:
        - name: logging-storage
          rules:
            - alert: LokiStorageUsageHigh
              expr: >-
                100 * kubelet_volume_stats_used_bytes{namespace="monitoring", persistentvolumeclaim=~"storage-loki-.*"}
                / kubelet_volume_stats_capacity_bytes{namespace="monitoring", persistentvolumeclaim=~"storage-loki-.*"} > 70
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: Loki storage is over 70% full
                description: Loki PVC {{ $labels.persistentvolumeclaim }} is {{ $value | printf "%.1f" }}% full.
            - alert: LokiStorageUsageCritical
              expr: >-
                100 * kubelet_volume_stats_used_bytes{namespace="monitoring", persistentvolumeclaim=~"storage-loki-.*"}
                / kubelet_volume_stats_capacity_bytes{namespace="monitoring", persistentvolumeclaim=~"storage-loki-.*"} > 85
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: Loki storage is over 85% full
                description: Loki PVC {{ $labels.persistentvolumeclaim }} is {{ $value | printf "%.1f" }}% full and may stop accepting logs.
            - alert: LokiStorageFillingSoon
              expr: >-
                predict_linear(kubelet_volume_stats_available_bytes{namespace="monitoring", persistentvolumeclaim=~"storage-loki-.*"}[6h], 24 * 60 * 60) < 0
                and kubelet_volume_stats_used_bytes{namespace="monitoring", persistentvolumeclaim=~"storage-loki-.*"}
                / kubelet_volume_stats_capacity_bytes{namespace="monitoring", persistentvolumeclaim=~"storage-loki-.*"} > 0.2
              for: 30m
              labels:
                severity: warning
              annotations:
                summary: Loki storage may fill within 24 hours
                description: Loki PVC {{ $labels.persistentvolumeclaim }} is growing quickly enough to exhaust its available space within 24 hours.
        - name: logging-ingestion
          rules:
            - alert: LokiDiscardingLogs
              expr: sum(rate(loki_discarded_samples_total[5m])) by (reason) > 0
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: Loki is rejecting logs
                description: Loki is rejecting {{ $value | printf "%.1f" }} log lines per second because of {{ $labels.reason }}.
            - alert: LokiDiscardingLogBytes
              expr: sum(rate(loki_discarded_bytes_total[5m])) by (reason) > 0
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: Loki is rejecting log data
                description: Loki is rejecting {{ $value | humanize1024 }}B per second because of {{ $labels.reason }}.
            - alert: AlloyDroppingLogs
              expr: sum(rate(loki_process_dropped_lines_total[5m])) by (reason) > 0
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: Alloy is dropping logs
                description: Alloy is dropping {{ $value | printf "%.1f" }} log lines per second because of {{ $labels.reason }}.
            - alert: AlloyDeliveryFailures
              expr: sum(rate(loki_write_dropped_entries_total[5m])) > 0
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: Alloy cannot deliver logs
                description: Alloy is dropping {{ $value | printf "%.1f" }} log lines per second after failed delivery attempts.
