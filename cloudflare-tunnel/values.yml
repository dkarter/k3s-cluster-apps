# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.1.0/charts/other/app-template/values.schema.json

# Prevent scheduling on control plane - k3s0 has service networking issues
defaultPodOptions:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist

controllers:
  cloudflared:
    replicas: 2
    strategy: RollingUpdate

    pod:
      annotations:
        k3s.pro/tunnel-token-revision: '1'
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/controller: cloudflared
              app.kubernetes.io/instance: cloudflare-tunnel

    containers:
      app:
        image:
          repository: cloudflare/cloudflared
          tag: 2026.9.1
          pullPolicy: IfNotPresent

        args:
          - tunnel
          - --no-autoupdate
          - --metrics
          - 0.0.0.0:2000
          - run
          - --token-file
          - /etc/cloudflared/token

        probes:
          liveness:
            enabled: false
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ready
                port: 2000
              periodSeconds: 10
              timeoutSeconds: 2
              failureThreshold: 3
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ready
                port: 2000
              periodSeconds: 5
              timeoutSeconds: 2
              failureThreshold: 60

persistence:
  tunnel-token:
    type: secret
    name: cloudflare-tunnel-credentials
    items:
      - key: tunnel_token
        path: token
    advancedMounts:
      cloudflared:
        app:
          - path: /etc/cloudflared/token
            subPath: token
            readOnly: true

service:
  metrics:
    controller: cloudflared
    ports:
      metrics:
        port: 2000

serviceMonitor:
  cloudflared:
    enabled: true
    serviceName: cloudflare-tunnel
    endpoints:
      - port: metrics
        scheme: http
        path: /metrics
        interval: 30s
        scrapeTimeout: 10s
