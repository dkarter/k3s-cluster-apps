# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-4.6.2/charts/other/app-template/values.schema.json

# Prevent scheduling on control plane - k3s0 has service networking issues
defaultPodOptions:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist

controllers:
  nextcloud:
    strategy: Recreate
    replicas: 1

    containers:
      app:
        image:
          repository: nextcloud
          tag: 33.0.8
          pullPolicy: IfNotPresent

        env:
          NEXTCLOUD_TRUSTED_DOMAINS: nextcloud.k3s.pro nc.tnnl.me
          POSTGRES_HOST: db-rw.nextcloud.svc.cluster.local:5432
          POSTGRES_DB: app
          REDIS_HOST: nextcloud-redis.nextcloud.svc.cluster.local
          NEXTCLOUD_ADMIN_USER:
            valueFrom:
              secretKeyRef:
                name: nextcloud-admin
                key: username
          NEXTCLOUD_ADMIN_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: nextcloud-admin
                key: password
          POSTGRES_USER:
            valueFrom:
              secretKeyRef:
                name: db-app
                key: username
          POSTGRES_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: db-app
                key: password
          SMTP_USERNAME:
            valueFrom:
              secretKeyRef:
                name: nextcloud-smtp
                key: username
          SMTP_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: nextcloud-smtp
                key: password

        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /status.php
                port: 80
                httpHeaders: &probeHeaders
                  - name: Host
                    value: nextcloud.k3s.pro
              periodSeconds: 10
              failureThreshold: 60
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /status.php
                port: 80
                httpHeaders: *probeHeaders
              initialDelaySeconds: 60
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 5
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /status.php
                port: 80
                httpHeaders: *probeHeaders
              initialDelaySeconds: 30
              periodSeconds: 10

  redis:
    containers:
      app:
        image:
          repository: redis
          tag: 8.10.1-alpine
          pullPolicy: IfNotPresent

        command:
          - redis-server
          - --save
          - '60'
          - '1'
          - --loglevel
          - warning

  cloudflared:
    replicas: 2
    strategy: RollingUpdate

    pod:
      annotations:
        k3s.pro/tunnel-token-revision: '1'
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/controller: cloudflared
              app.kubernetes.io/instance: nextcloud

    containers:
      app:
        image:
          repository: cloudflare/cloudflared
          tag: 2026.8.2
          pullPolicy: IfNotPresent

        args:
          - tunnel
          - --no-autoupdate
          - --metrics
          - 0.0.0.0:2000
          - run
          - --token-file
          - /etc/cloudflared/token

        probes:
          liveness:
            enabled: false
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ready
                port: 2000
              periodSeconds: 10
              timeoutSeconds: 2
              failureThreshold: 3
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ready
                port: 2000
              periodSeconds: 5
              timeoutSeconds: 2
              failureThreshold: 60

persistence:
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 10Gi
    advancedMounts:
      nextcloud:
        app:
          - path: /var/www/html

  data:
    type: persistentVolumeClaim
    existingClaim: nextcloud-nas-data
    advancedMounts:
      nextcloud:
        app:
          - path: /var/www/html/data

  tunnel-token:
    type: secret
    name: cloudflare-tunnel-credentials
    items:
      - key: tunnel_token
        path: token
    advancedMounts:
      cloudflared:
        app:
          - path: /etc/cloudflared/token
            subPath: token
            readOnly: true

  trusted-domains:
    type: configMap
    identifier: trusted-domains
    advancedMounts:
      nextcloud:
        app:
          - path: /var/www/html/config/trusted-domains.config.php
            subPath: trusted-domains.config.php
            readOnly: true

  redis-data:
    type: emptyDir
    advancedMounts:
      redis:
        app:
          - path: /data

configMaps:
  trusted-domains:
    data:
      trusted-domains.config.php: |
        <?php
        $smtpUsername = getenv('SMTP_USERNAME');
        [$smtpFromAddress, $smtpDomain] = explode('@', $smtpUsername, 2);

        $CONFIG = [
          'trusted_domains' => [
            'localhost',
            'nextcloud.k3s.pro',
            'nc.tnnl.me',
          ],
          'trusted_proxies' => [
            '10.42.0.0/16',
          ],
          'overwriteprotocol' => 'https',
          'overwrite.cli.url' => 'https://nextcloud.k3s.pro',
          'files.chunked_upload.max_size' => 50 * 1024 * 1024,
          'maintenance_window_start' => 8,
          'default_phone_region' => 'US',
          'serverid' => 0,
          'mail_smtpmode' => 'smtp',
          'mail_sendmailmode' => 'smtp',
          'mail_smtphost' => 'smtp.protonmail.ch',
          'mail_smtpport' => 587,
          'mail_smtpsecure' => 'tls',
          'mail_smtpauth' => true,
          'mail_smtpname' => $smtpUsername,
          'mail_smtppassword' => getenv('SMTP_PASSWORD'),
          'mail_from_address' => $smtpFromAddress,
          'mail_domain' => $smtpDomain,
        ];

service:
  nextcloud:
    controller: nextcloud
    ports:
      http:
        port: 80

  redis:
    controller: redis
    ports:
      redis:
        port: 6379

  cloudflared-metrics:
    controller: cloudflared
    ports:
      metrics:
        port: 2000

serviceMonitor:
  cloudflared:
    enabled: true
    serviceName: nextcloud-cloudflared-metrics
    endpoints:
      - port: metrics
        scheme: http
        path: /metrics
        interval: 30s
        scrapeTimeout: 10s

ingress:
  main:
    enabled: true
    annotations:
      # Homepage integration
      gethomepage.dev/enabled: 'true'
      gethomepage.dev/name: Nextcloud
      gethomepage.dev/description: File Sharing & Collaboration
      gethomepage.dev/group: Apps
      gethomepage.dev/icon: nextcloud.svg
      gethomepage.dev/siteMonitor: 'https://nextcloud.k3s.pro'

      # cert-manager
      kubernetes.io/ingress.class: 'traefik'
      cert-manager.io/cluster-issuer: 'letsencrypt'

      # Security headers
      traefik.ingress.kubernetes.io/router.middlewares: nextcloud-security-headers@kubernetescrd
    className: 'traefik'
    hosts:
      - host: &host 'nextcloud.k3s.pro'
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: nextcloud
              port: http
    tls:
      - hosts:
          - *host
        secretName: nextcloud-ingress-cert
