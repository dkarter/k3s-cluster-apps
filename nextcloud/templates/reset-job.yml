# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.31.0-standalone-strict/job-batch-v1.json
apiVersion: batch/v1
kind: Job
metadata:
  name: nextcloud-reset
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: reset
          image: ghcr.io/cloudnative-pg/postgresql:18.0-system-trixie
          securityContext:
            runAsUser: 0
          env:
            - name: PGHOST
              value: db-rw.nextcloud.svc.cluster.local
            - name: PGDATABASE
              value: app
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: db-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-app
                  key: password
          command:
            - /bin/sh
            - -c
          args:
            - |
                set -eu
                psql --set ON_ERROR_STOP=1 --command='DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
                find /nextcloud-config -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
                find /nextcloud-data -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          volumeMounts:
            - name: config
              mountPath: /nextcloud-config
            - name: data
              mountPath: /nextcloud-data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: nextcloud
        - name: data
          persistentVolumeClaim:
            claimName: nextcloud-nas-data
