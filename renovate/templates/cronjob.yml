# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.31.4-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
spec:
  schedule: '17 * * * *'
  timeZone: Etc/UTC
  # Enable only after the dry run and hosted-bot cutover in renovate/README.md.
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      # Installation tokens last one hour. End the job before token expiry.
      activeDeadlineSeconds: 3000
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: renovate
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 12021
            runAsGroup: 12021
            fsGroup: 12021
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: renovate
              image: ghcr.io/renovatebot/renovate:44.176.2
              command: [node, /etc/renovate/runner.cjs]
              env:
                - name: RENOVATE_APP_ID
                  valueFrom:
                    secretKeyRef:
                      name: renovate-app
                      key: app-id
                - name: RENOVATE_INSTALLATION_ID
                  valueFrom:
                    secretKeyRef:
                      name: renovate-app
                      key: installation-id
                - name: RENOVATE_PLATFORM
                  value: github
                - name: RENOVATE_REPOSITORIES
                  value: '["dkarter/k3s-cluster-apps"]'
                - name: RENOVATE_AUTODISCOVER
                  value: 'false'
                - name: RENOVATE_ONBOARDING
                  value: 'false'
                - name: RENOVATE_REQUIRE_CONFIG
                  value: required
                - name: RENOVATE_PLATFORM_COMMIT
                  value: enabled
                - name: RENOVATE_DRY_RUN
                  value: full
                - name: RENOVATE_ALLOW_SCRIPTS
                  value: 'false'
                - name: RENOVATE_ALLOW_PLUGINS
                  value: 'false'
                - name: RENOVATE_BASE_DIR
                  value: /tmp/renovate
                - name: LOG_LEVEL
                  value: info
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: '2'
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: runner
                  mountPath: /etc/renovate
                  readOnly: true
                - name: app-key
                  mountPath: /var/run/renovate-app
                  readOnly: true
                - name: work
                  mountPath: /tmp
          volumes:
            - name: runner
              configMap:
                name: renovate-runner
            - name: app-key
              secret:
                secretName: renovate-app
                defaultMode: 0440
                items:
                  - key: private-key
                    path: private-key.pem
            - name: work
              emptyDir:
                sizeLimit: 4Gi
