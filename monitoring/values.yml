crds:
  enabled: false

alertmanager:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      kubernetes.io/ingress.class: 'traefik'
      cert-manager.io/cluster-issuer: 'letsencrypt'
    hosts:
      - 'alertmanager.k3s.pro'
    paths:
      - /
    pathType: Prefix
    tls:
      - secretName: alertmanager-ingress-cert
        hosts:
          - 'alertmanager.k3s.pro'

grafana:
  admin:
    existingSecret: 'grafana-admin'
    userKey: grafana_username
    passwordKey: grafana_password
  serviceMonitor:
    interval: 15s
    scrapeTimeout: 10s
  podAnnotations:
    k3s.pro/restartedAt: '2026-04-24T22:11:51Z'
  additionalDataSources:
    - name: PostgreSQL
      uid: PostgreSQL
      type: postgres
      access: proxy
      url: blocky-db-rw.blocky.svc.cluster.local:5432
      user: grafana_readonly
      secureJsonData:
        password: $__file{/etc/secrets/postgres-password/password}
      jsonData:
        database: app
        sslmode: disable
        postgresVersion: 1700
        timescaledb: true
      version: 1
      editable: true
  extraSecretMounts:
    - name: postgres-password
      secretName: grafana-postgresql-credentials
      defaultMode: 0440
      mountPath: /etc/secrets/postgres-password
      readOnly: true
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: '1'
      searchNamespace: ALL
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
  dashboards:
    default:
      # Canonical dashboard maintained by Argo CD, pinned to the deployed app version.
      argocd:
        url: https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.2/examples/dashboard.json
      blocky:
        url: https://raw.githubusercontent.com/0xERR0R/blocky/refs/heads/main/docs/blocky-grafana.json
      blocky_querylog:
        url: https://raw.githubusercontent.com/dkarter/k3s-cluster-apps/refs/heads/main/monitoring/dashboards/blocky-query.json
      speedtest:
        url: https://raw.githubusercontent.com/dkarter/k3s-cluster-apps/refs/heads/main/monitoring/dashboards/speedtest.json
      atmowatch:
        url: https://raw.githubusercontent.com/dkarter/k3s-cluster-apps/refs/heads/main/monitoring/dashboards/atmowatch.json
      cloudflared:
        url: https://raw.githubusercontent.com/dkarter/k3s-cluster-apps/refs/heads/main/monitoring/dashboards/cloudflared.json
      # Adapted for K3s/Traefik v2.11 from Traefik Labs' official Kubernetes dashboard revision 9.
      # https://grafana.com/grafana/dashboards/17347?tab=revisions
      traefik:
        url: https://raw.githubusercontent.com/dkarter/k3s-cluster-apps/refs/heads/main/monitoring/dashboards/traefik.json
      # Adapted from the cert-manager monitoring mixin referenced by the official docs.
      # https://github.com/imusmanmalik/cert-manager-mixin/commit/a5f74ad04be4ee8fc007a10a918b3c48154c7e55
      cert_manager:
        url: https://raw.githubusercontent.com/dkarter/k3s-cluster-apps/refs/heads/main/monitoring/dashboards/cert-manager.json
      longhorn:
        url: https://raw.githubusercontent.com/dkarter/k3s-cluster-apps/refs/heads/main/monitoring/dashboards/longhorn.json
      # Adapted for MetalLB 0.16.1 from Grafana dashboard 20162 revision 6.
      # https://grafana.com/grafana/dashboards/20162-metallb/
      metallb:
        url: https://raw.githubusercontent.com/dkarter/k3s-cluster-apps/refs/heads/main/monitoring/dashboards/metallb.json
        datasource:
          - name: DS_PROMETHEUS
            value: prometheus
      # Official CloudNativePG dashboard, pinned to the upstream JSON revision.
      # https://github.com/cloudnative-pg/grafana-dashboards/commit/7dd1bc255b5202530e1bae7b858a3bb41a2028c7
      cloudnative_pg:
        url: https://raw.githubusercontent.com/cloudnative-pg/grafana-dashboards/7dd1bc255b5202530e1bae7b858a3bb41a2028c7/charts/cluster/grafana-dashboard.json
        datasource:
          - name: DS_PROMETHEUS
            value: prometheus
          - name: DS_EXPRESSION
            value: __expr__
      # Adapted from the dashboard bundled with External Secrets chart 2.7.0.
      # https://github.com/external-secrets/external-secrets/commit/67a603db02ef92ea0eee6b091927f2727cc54eaa
      external_secrets:
        url: https://raw.githubusercontent.com/dkarter/k3s-cluster-apps/refs/heads/main/monitoring/dashboards/external-secrets.json
      # Adapted from Exportarr's v2.3.0 Media Dashboard for the Bazarr exporter.
      # https://github.com/onedr0p/exportarr/blob/v2.3.0/examples/grafana/dashboard2.json
      bazarr_exportarr:
        url: https://raw.githubusercontent.com/dkarter/k3s-cluster-apps/refs/heads/main/monitoring/dashboards/bazarr-exportarr.json
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      kubernetes.io/ingress.class: 'traefik'
      cert-manager.io/cluster-issuer: 'letsencrypt'

      gethomepage.dev/enabled: 'true'
      gethomepage.dev/description: Dashboards and alerts
      gethomepage.dev/group: System
      gethomepage.dev/icon: grafana.svg
      gethomepage.dev/name: Grafana
      gethomepage.dev/siteMonitor: 'https://grafana.k3s.pro/api/health'
      gethomepage.dev/pod-selector: >-
        app.kubernetes.io/name=grafana
      gethomepage.dev/widget.type: 'grafana'
      gethomepage.dev/widget.url: 'https://grafana.k3s.pro'
      gethomepage.dev/widget.username: 'admin'
      gethomepage.dev/widget.password: '{{`{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}`}}'
    hosts:
      - 'grafana.k3s.pro'
    paths:
      - /
    pathType: Prefix
    tls:
      - secretName: grafana-ingress-cert
        hosts:
          - 'grafana.k3s.pro'

prometheus:
  additionalPodMonitors:
    - name: traefik
      namespaceSelector:
        matchNames:
          - kube-system
      selector:
        matchLabels:
          app.kubernetes.io/name: traefik
          app.kubernetes.io/instance: traefik-kube-system
      podMetricsEndpoints:
        - port: metrics
          interval: 15s
          scrapeTimeout: 10s

  # ref: https://github.com/prometheus-operator/prometheus-operator/blob/master/Documentation/api.md#prometheusspec
  prometheusSpec:
    # ref: https://github.com/prometheus-operator/prometheus-operator/blob/release-0.44/pkg/prometheus/promcfg.go#L180-L183
    scrapeInterval: 15s

    retention: 7d

    # Watch all PrometheusRules in the cluster.
    ruleNamespaceSelector:
      matchLabels: {}
    ruleSelector:
      matchLabels: {}

    # Watch all ServiceMonitors in the cluster.
    serviceMonitorNamespaceSelector:
      matchLabels: {}
    serviceMonitorSelector:
      matchLabels: {}

    # Watch all PodMonitors in the cluster.
    podMonitorSelector:
      matchLabels: {}
    podMonitorNamespaceSelector:
      matchLabels: {}

    # Additional scrape configurations for external endpoints
    additionalScrapeConfigs:
      - job_name: 'atmo-watch'
        static_configs:
          - targets:
              - '10.0.0.76:80'
        metrics_path: '/metrics'
        scheme: http
