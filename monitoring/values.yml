crds:
  enabled: false

extraManifests:
  # The PodMonitor CRD only permits Secret-backed authorization credentials.
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: metrics-server-prometheus
      namespace: monitoring
    automountServiceAccountToken: false
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: metrics-server-prometheus
    rules:
      - nonResourceURLs:
          - /metrics
        verbs:
          - get
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: metrics-server-prometheus
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: metrics-server-prometheus
    subjects:
      - kind: ServiceAccount
        name: metrics-server-prometheus
        namespace: monitoring
  - apiVersion: v1
    kind: Secret
    metadata:
      name: metrics-server-prometheus-token
      namespace: monitoring
      annotations:
        kubernetes.io/service-account.name: metrics-server-prometheus
    type: kubernetes.io/service-account-token

kube-state-metrics:
  metricLabelsAllowlist:
    - statefulsets=[tailscale.com/managed]

alertmanager:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      kubernetes.io/ingress.class: 'traefik'
      cert-manager.io/cluster-issuer: 'letsencrypt'
    hosts:
      - 'alertmanager.k3s.pro'
    paths:
      - /
    pathType: Prefix
    tls:
      - secretName: alertmanager-ingress-cert
        hosts:
          - 'alertmanager.k3s.pro'

grafana:
  admin:
    existingSecret: 'grafana-admin'
    userKey: grafana_username
    passwordKey: grafana_password
  serviceMonitor:
    interval: 15s
    scrapeTimeout: 10s
  podAnnotations:
    k3s.pro/restartedAt: '2026-04-24T22:11:51Z'
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      jsonData:
        maxLines: 1000
      version: 1
      editable: false
    - name: PostgreSQL
      uid: PostgreSQL
      type: postgres
      access: proxy
      url: blocky-db-rw.blocky.svc.cluster.local:5432
      user: grafana_readonly
      secureJsonData:
        password: $__file{/etc/secrets/postgres-password/password}
      jsonData:
        database: app
        sslmode: disable
        postgresVersion: 1700
        timescaledb: true
      version: 1
      editable: true
  extraSecretMounts:
    - name: postgres-password
      secretName: grafana-postgresql-credentials
      defaultMode: 0440
      mountPath: /etc/secrets/postgres-password
      readOnly: true
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: '1'
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      annotations:
        grafana_folder: Kubernetes
      provider:
        name: sidecar
        disableDelete: false
        foldersFromFilesStructure: true
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: applications
          orgId: 1
          folder: Applications
          type: file
          disableDeletion: false
          allowUiUpdates: true
          options:
            path: /var/lib/grafana/dashboards/applications
        - name: infrastructure
          orgId: 1
          folder: Infrastructure
          type: file
          disableDeletion: false
          allowUiUpdates: true
          options:
            path: /var/lib/grafana/dashboards/infrastructure
        - name: kubernetes
          orgId: 1
          folder: Kubernetes
          type: file
          disableDeletion: false
          allowUiUpdates: true
          options:
            path: /var/lib/grafana/dashboards/kubernetes
        - name: media
          orgId: 1
          folder: Media
          type: file
          disableDeletion: false
          allowUiUpdates: true
          options:
            path: /var/lib/grafana/dashboards/media
        - name: platform
          orgId: 1
          folder: Platform
          type: file
          disableDeletion: false
          allowUiUpdates: true
          options:
            path: /var/lib/grafana/dashboards/platform
  dashboards:
    applications:
      atmowatch:
        url: https://raw.githubusercontent.com/dkarter/k3s-cluster-apps/refs/heads/main/monitoring/dashboards/atmowatch.json
      blocky:
        # Official Blocky dashboard pinned to the upstream source revision.
        # https://github.com/0xERR0R/blocky/commit/45a242ffce62c3e203f9a2c8a87fbb8ba106c7ab
        url: https://raw.githubusercontent.com/0xERR0R/blocky/45a242ffce62c3e203f9a2c8a87fbb8ba106c7ab/docs/blocky-grafana.json
        title: Blocky / Overview
      blocky-query-log:
        url: https://raw.githubusercontent.com/dkarter/k3s-cluster-apps/3a04048401957b024330d5767415f7e59a782d05/monitoring/dashboards/blocky-query.json
      speedtest:
        url: https://raw.githubusercontent.com/dkarter/k3s-cluster-apps/refs/heads/main/monitoring/dashboards/speedtest.json
    infrastructure:
      cloudflare-tunnel:
        url: https://raw.githubusercontent.com/dkarter/k3s-cluster-apps/refs/heads/main/monitoring/dashboards/cloudflared.json
      # Adapted for K3s/Traefik v2.11 from Traefik Labs' official Kubernetes dashboard revision 9.
      # https://grafana.com/grafana/dashboards/17347?tab=revisions
      traefik:
        url: https://raw.githubusercontent.com/dkarter/k3s-cluster-apps/refs/heads/main/monitoring/dashboards/traefik.json
      longhorn:
        url: https://raw.githubusercontent.com/dkarter/k3s-cluster-apps/refs/heads/main/monitoring/dashboards/longhorn.json
      # Adapted for MetalLB 0.16.1 from Grafana dashboard 20162 revision 6.
      # https://grafana.com/grafana/dashboards/20162-metallb/
      metallb:
        url: https://raw.githubusercontent.com/dkarter/k3s-cluster-apps/refs/heads/main/monitoring/dashboards/metallb.json
        datasource:
          - name: DS_PROMETHEUS
            value: prometheus
      # Built from the live SMB plugin endpoint and pinned CSI sidecar metric definitions.
      # No official SMB CSI dashboard exists for chart 1.20.3.
      smb-csi:
        url: https://raw.githubusercontent.com/dkarter/k3s-cluster-apps/refs/heads/main/monitoring/dashboards/smb-csi.json
    kubernetes:
      # Built from Metrics Server 0.7.2's live deployment and upstream metric definitions.
      # No canonical dashboard exists in metrics-server or the Kubernetes monitoring mixin.
      metrics-server:
        url: https://raw.githubusercontent.com/dkarter/k3s-cluster-apps/refs/heads/main/monitoring/dashboards/metrics-server.json
    media:
      # Adapted from Exportarr's v2.3.0 Media Dashboard for the Bazarr exporter.
      # https://github.com/onedr0p/exportarr/blob/v2.3.0/examples/grafana/dashboard2.json
      bazarr:
        url: https://raw.githubusercontent.com/dkarter/k3s-cluster-apps/refs/heads/main/monitoring/dashboards/bazarr-exportarr.json
      # Adapted from Exportarr v2.3.0's canonical dashboard for this cluster's SABnzbd scrape labels.
      # https://github.com/onedr0p/exportarr/blob/v2.3.0/examples/grafana/dashboard2.json
      sabnzbd:
        url: https://raw.githubusercontent.com/dkarter/k3s-cluster-apps/refs/heads/main/monitoring/dashboards/sabnzbd.json
      # Adapted for Exportarr 2.3.0 from its canonical multi-application dashboard.
      # https://github.com/onedr0p/exportarr/commit/367f6031dfefeba87b88be55f5780267cb143975
      sonarr:
        url: https://raw.githubusercontent.com/dkarter/k3s-cluster-apps/refs/heads/main/monitoring/dashboards/sonarr.json
    platform:
      # Canonical dashboard maintained by Argo CD, pinned to the deployed app version.
      argocd:
        url: https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.2/examples/dashboard.json
        title: Argo CD / Overview
      # Adapted from the cert-manager monitoring mixin referenced by the official docs.
      # https://github.com/imusmanmalik/cert-manager-mixin/commit/a5f74ad04be4ee8fc007a10a918b3c48154c7e55
      cert-manager:
        url: https://raw.githubusercontent.com/dkarter/k3s-cluster-apps/refs/heads/main/monitoring/dashboards/cert-manager.json
      # Official CloudNativePG dashboard, pinned to the upstream JSON revision.
      # https://github.com/cloudnative-pg/grafana-dashboards/commit/7dd1bc255b5202530e1bae7b858a3bb41a2028c7
      cloudnativepg:
        url: https://raw.githubusercontent.com/cloudnative-pg/grafana-dashboards/7dd1bc255b5202530e1bae7b858a3bb41a2028c7/charts/cluster/grafana-dashboard.json
        title: CloudNativePG / Overview
        datasource:
          - name: DS_PROMETHEUS
            value: prometheus
          - name: DS_EXPRESSION
            value: __expr__
      # Adapted from the dashboard bundled with External Secrets chart 2.7.0.
      # https://github.com/external-secrets/external-secrets/commit/67a603db02ef92ea0eee6b091927f2727cc54eaa
      external-secrets:
        url: https://raw.githubusercontent.com/dkarter/k3s-cluster-apps/refs/heads/main/monitoring/dashboards/external-secrets.json
      # Built from Connect 1.7.3's live /metrics output; no canonical upstream dashboard exists.
      # ServiceMonitor provenance: https://github.com/1Password/connect-helm-charts/tree/connect-1.17.1
      onepassword-connect:
        url: https://raw.githubusercontent.com/dkarter/k3s-cluster-apps/refs/heads/main/monitoring/dashboards/onepassword-connect.json
      # Built from Tailscale operator 1.98.9's live metrics and pinned controller-runtime definitions.
      # No canonical upstream operator dashboard exists for this release.
      tailscale-operator:
        url: https://raw.githubusercontent.com/dkarter/k3s-cluster-apps/refs/heads/main/monitoring/dashboards/tailscale-operator.json
      # Built from the live Prometheus Operator v0.92.1 metric inventory; the official mixin has alerts but no dashboard.
      # https://github.com/prometheus-operator/prometheus-operator/tree/v0.92.1/jsonnet/mixin
      prometheus-operator:
        url: https://raw.githubusercontent.com/dkarter/k3s-cluster-apps/refs/heads/main/monitoring/dashboards/prometheus-operator.json
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      kubernetes.io/ingress.class: 'traefik'
      cert-manager.io/cluster-issuer: 'letsencrypt'

      gethomepage.dev/enabled: 'true'
      gethomepage.dev/description: Dashboards and alerts
      gethomepage.dev/group: System
      gethomepage.dev/icon: grafana.svg
      gethomepage.dev/name: Grafana
      gethomepage.dev/siteMonitor: 'https://grafana.k3s.pro/api/health'
      gethomepage.dev/pod-selector: >-
        app.kubernetes.io/name=grafana
      gethomepage.dev/widget.type: 'grafana'
      gethomepage.dev/widget.url: 'https://grafana.k3s.pro'
      gethomepage.dev/widget.username: 'admin'
      gethomepage.dev/widget.password: '{{`{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}`}}'
    hosts:
      - 'grafana.k3s.pro'
    paths:
      - /
    pathType: Prefix
    tls:
      - secretName: grafana-ingress-cert
        hosts:
          - 'grafana.k3s.pro'

prometheus:
  additionalPodMonitors:
    - name: metrics-server
      namespaceSelector:
        matchNames:
          - kube-system
      selector:
        matchLabels:
          k8s-app: metrics-server
      podMetricsEndpoints:
        - port: https
          scheme: https
          path: /metrics
          interval: 15s
          scrapeTimeout: 10s
          authorization:
            type: Bearer
            credentials:
              name: metrics-server-prometheus-token
              key: token
          tlsConfig:
            # K3s Metrics Server generates an ephemeral serving certificate without service DNS SANs.
            insecureSkipVerify: true
    - name: traefik
      namespaceSelector:
        matchNames:
          - kube-system
      selector:
        matchLabels:
          app.kubernetes.io/name: traefik
          app.kubernetes.io/instance: traefik-kube-system
      podMetricsEndpoints:
        - port: metrics
          interval: 15s
          scrapeTimeout: 10s
    - name: csi-smb-controller
      namespaceSelector:
        matchNames:
          - kube-system
      selector:
        matchLabels:
          app: csi-smb-controller
      podMetricsEndpoints:
        - port: metrics
          interval: 15s
          scrapeTimeout: 10s
          relabelings:
            - targetLabel: component
              replacement: smb
        - port: metrics
          interval: 15s
          scrapeTimeout: 10s
          relabelings:
            - sourceLabels:
                - __meta_kubernetes_pod_ip
              targetLabel: __address__
              replacement: '$1:29645'
            - targetLabel: component
              replacement: provisioner
        - port: metrics
          interval: 15s
          scrapeTimeout: 10s
          relabelings:
            - sourceLabels:
                - __meta_kubernetes_pod_ip
              targetLabel: __address__
              replacement: '$1:29646'
            - targetLabel: component
              replacement: resizer

  # ref: https://github.com/prometheus-operator/prometheus-operator/blob/master/Documentation/api.md#prometheusspec
  prometheusSpec:
    # ref: https://github.com/prometheus-operator/prometheus-operator/blob/release-0.44/pkg/prometheus/promcfg.go#L180-L183
    scrapeInterval: 15s

    retention: 7d

    # Watch all PrometheusRules in the cluster.
    ruleNamespaceSelector:
      matchLabels: {}
    ruleSelector:
      matchLabels: {}

    # Watch all ServiceMonitors in the cluster.
    serviceMonitorNamespaceSelector:
      matchLabels: {}
    serviceMonitorSelector:
      matchLabels: {}

    # Watch all PodMonitors in the cluster.
    podMonitorSelector:
      matchLabels: {}
    podMonitorNamespaceSelector:
      matchLabels: {}

    # Additional scrape configurations for external endpoints
    additionalScrapeConfigs:
      - job_name: 'atmo-watch'
        static_configs:
          - targets:
              - '10.0.0.76:80'
        metrics_path: '/metrics'
        scheme: http
